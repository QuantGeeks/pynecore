name: qg-ci
on:
  pull_request: { branches: [qg/main] }
  push: { branches: [qg/main] }
  workflow_dispatch:
permissions: { contents: read }
env: { PYNE_SAVE_SCRIPT_TOML: "0" }
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pipx install uv==0.8.24
      - run: uv venv .venv --python 3.12 && uv pip install --python .venv -e '.[dev,cli]' httpx
      - run: .venv/bin/python -m pytest tests qg/tests
      - run: .venv/bin/python -I qg/tools/check_fork_md.py --repo . --base v6.10.10
